function entryPreviewHTML(list, dupMap){
  var h = '<div class="preview">';
  list.forEach(function(e, i){
    var dup = dupMap[i];
    var roots = (e.roots||[]).map(rootLabel);
    h += '<div><span class="en">'+esc(e.en||'（无英语）')+'</span>' +
         '<span class="zh">'+esc(e.zh||'（无汉语）')+
         roots.map(function(r){
           var info = rootInfo(r);
           return ' <span class="tag root">⌘ <b>'+esc(r)+'</b>'+(info? ' '+esc(info.gloss):'')+'</span>';
         }).join('') +
         (e.groupNames && e.groupNames.length? ' <span class="tag">'+esc(e.groupNames.join(' / '))+'</span>':'') +
         (dup? ' <span class="dup">已存在，将只补充分组/词根</span>':'') + '</span></div>';
  });
  h += '</div>';
  return h;
}
function previewImport(entries, opts){
  opts = opts || {};
  if(!entries.length){ toast('没有解析到任何词条', 'warn'); return; }
  var dupMap = {};
  entries.forEach(function(e, i){
    dupMap[i] = DB.words.some(function(w){
      return w.en.toLowerCase() === String(e.en||'').trim().toLowerCase() && w.zh === String(e.zh||'').trim();
    });
  });
  var dupN = Object.keys(dupMap).filter(function(k){ return dupMap[k]; }).length;
  var rootN = 0;
  entries.forEach(function(e){ rootN += (e.roots||[]).length; });
  openModal(
    '<h3>解析结果：共 '+entries.length+' 条</h3>' +
    '<p class="sub">'+(dupN? dupN+' 条已存在于词库（只补充分组与词根，不重复添加）。' : '全部为新词条。')+
    ' 识别到 '+rootN+' 个词根标签。确认后写入词库。</p>' +
    entryPreviewHTML(entries, dupMap) +
    '<div class="row" style="justify-content:flex-end"><button class="ghost" data-x="no">取消</button>' +
    '<button class="btn" data-x="yes">确认导入 '+entries.length+' 条</button></div>',
    function(m){
      $('[data-x=no]', m).onclick = closeModal;
      $('[data-x=yes]', m).onclick = function(){
        var extra = opts.forceGroups || [];
        var finalList = entries.map(function(e){
          var gn = (e.groupNames||[]).slice();
          extra.forEach(function(gid){
            var g = groupById(gid);
            if(g && gn.indexOf(g.name) < 0) gn.push(g.name);
          });
          return { en:e.en, zh:e.zh, roots:e.roots, notes:e.notes, groupNames:gn };
        });
        var r = addEntries(finalList);
        closeModal();
        ui.addText = '';
        if(ui.view === 'add') ui.view = 'words';
        render();
        toast('已添加 '+r.added+' 条'+(r.skipped? '，跳过/合并 '+r.skipped+' 条':''), 'ok');
      };
    });
}
function importJSONText(text){
  var data;
  try{ data = JSON.parse(text); }
  catch(e){ toast('JSON 解析失败：'+e.message, 'bad'); return; }
  var incoming = normalizeDB(Array.isArray(data)? { words:data, groups:[] } : data);
  if(!incoming.words.length && !incoming.groups.length){ toast('文件里没有可用词条', 'warn'); return; }
  var entries = incoming.words.map(function(w){
    var gn = w.groupIds.map(function(id){
      var g = incoming.groups.filter(function(x){ return x.id === id; })[0];
      return g? g.name : '';
    }).filter(Boolean);
    return { en:w.en, zh:w.zh, roots:w.roots, notes:w.notes, groupNames:gn };
  });
  previewImport(entries, {});
}
function doExport(){
  var data = JSON.stringify({ version:1, exportedAt:new Date().toISOString(), groups:DB.groups, words:DB.words }, null, 2);
  download('英语词库_'+stamp()+'.json', data, 'application/json');
  toast('已导出 '+DB.words.length+' 条词', 'ok');
}
function exportCSV(){
  var rows = [['en','zh','root','notes','groups','mastery']];
  DB.words.forEach(function(w){
    rows.push([w.en, w.zh, rootsOf(w).map(rootLabel).join('; '), w.notes,
               groupsOf(w).map(function(g){ return g.name; }).join('、'), w.mastery]);
  });
  var csv = rows.map(function(r){
    return r.map(function(v){
      var s = String(v==null?'':v);
      return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',');
  }).join('\r\n');
  download('英语词库_'+stamp()+'.csv', '\uFEFF'+csv, 'text/csv');
  toast('已导出 CSV', 'ok');
}
function stamp(){
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
function download(name, text, mime){
  try{
    var blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }catch(e){ toast('导出失败：'+e.message, 'bad'); }
}
function readFile(file, cb){
  var fr = new FileReader();
  fr.onload = function(){ cb(String(fr.result)); };
  fr.onerror = function(){ toast('读取文件失败', 'bad'); };
  fr.readAsText(file, 'utf-8');
}
function handleImportText(text, fileName){
  var t = String(text||'').trim();
  if(looksJSON(t)){ importJSONText(t); return; }
  var first = t.split(/\r?\n/)[0] || '';
  var isCSV = /\.csv$/i.test(fileName||'') || /^"?(en|pt|word|英语|葡语)"?\s*,/i.test(first);
  var entries = isCSV? parseCSV(t) : parseLines(t);
  if(!entries.length) entries = parseLines(t);
  previewImport(entries, {});
}
